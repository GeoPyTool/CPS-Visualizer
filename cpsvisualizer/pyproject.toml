[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpsvisualizer"
version = "1.3.6"
description = "CPS-Visualizer: visualization, similarity measurement, and statistical analysis of LA-ICP-MS surface scan data."
readme = "README.rst"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Qiu-Ye Yu, Ming-Hong Yao, Di Wang, Jian Cui, Zhi-Yan Wang, Fei-Fei Wang, Yan Liang" },
    { email = "softcheck@outlook.com" },
]
keywords = ["ICP-MS", "visualization", "geochemistry", "CPS", "LA-ICP-MS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.26",
    "pandas",
    "scipy",
    "xlrd",
    "openpyxl",
    "matplotlib",
    "PySide6",
    "scikit-learn",
    "scikit-image",
    "joblib",
    "umap-learn",
    "flask",
    "flask-cors",
]

[project.urls]
Homepage = "https://github.com/GeoPyTool/CPS-Visualizer"
Repository = "https://github.com/GeoPyTool/CPS-Visualizer"

[project.scripts]
cpsv = "cpsvisualizer.cli_entry:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cpsvisualizer*"]

[tool.setuptools.package-data]
cpsvisualizer = [
    "*.py",
    "*.txt",
    "*.png",
    "*.qm",
    "*.ttf",
    "*.ini",
    "*.md",
    "templates/*.html",
    "static/*",
    "resources/*",
]